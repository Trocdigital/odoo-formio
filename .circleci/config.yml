# Publish this repo's Odoo modules as a versioned OCI artifact (FEAT-012).
#
# COPY THIS FILE AS-IS into any addon repo at .circleci/config.yml. Nothing to edit: the
# artifact name comes from the repository name, and the series comes from the branch name.
# The artifact name must match the `artifact` key in
# odoo-deployments/registry/addons.yaml -- which is the repository name, by convention.
#
# WHAT THIS DOES NOT DO: deploy anything. It publishes an artifact and prints its name. An
# instance only moves when a human edits that instance's addons.yaml in navigator-platform.
# Pushing code here builds a version; it does not install it anywhere. That separation is
# the point -- two clients can sit on different versions of this repo indefinitely.
#
# Version format: <series>-<channel>.<sha12>, e.g. 16.0-dev.9f2c1a4b77e3
#   - the series prefix is REQUIRED: the Helm chart refuses to render an instance whose pin
#     does not start with its own odooSeries, which is what stops 16.0 code being mounted
#     into a 19.0 instance.
#   - the channel records where the code came FROM, not where it will run.
#
# Requires two project environment variables: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
# Use the existing `circleCI` IAM user -- it already has ECR push on odoo-addons/*.

version: 2.1

parameters:
  # No account id and no registry host here on purpose: both are derived at run time from
  # the credentials the job already holds. One less constant to keep in sync, and the same
  # file works unchanged in any account.
  ecr_prefix:
    type: string
    default: "odoo-addons"
  aws_region:
    # Fallback only. AWS_REGION / AWS_DEFAULT_REGION from the project settings win.
    type: string
    default: "us-east-2"
  oras_version:
    type: string
    default: "1.3.3"

jobs:
  publish:
    docker:
      - image: cimg/aws:2024.03
    steps:
      - checkout

      - run:
          name: Get AWS credentials
          command: |
            set -euo pipefail
            # PREFERRED: OIDC. CircleCI presents a short-lived signed token, AWS exchanges it
            # for temporary credentials, and nothing long-lived is ever stored in the project.
            # Set AWS_ROLE_ARN (from the circleci_addon_publisher_role_arn Terraform output)
            # and attach any context to the job -- CircleCI only injects CIRCLE_OIDC_TOKEN_V2
            # into jobs that use at least one context, even an empty one.
            #
            # FALLBACK: a static AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY pair, which the
            # AWS CLI picks up on its own. Works, but it is a credential that never expires
            # sitting in a CI project, so treat it as temporary.
            if [ -n "${AWS_ROLE_ARN:-}" ] && [ -n "${CIRCLE_OIDC_TOKEN_V2:-}" ]; then
              echo "authenticating with OIDC (no stored keys)"
              creds="$(aws sts assume-role-with-web-identity \
                --role-arn "$AWS_ROLE_ARN" \
                --role-session-name "circleci-${CIRCLE_PROJECT_REPONAME}-${CIRCLE_BUILD_NUM}" \
                --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
                --duration-seconds 3600 \
                --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
                --output text)"
              {
                echo "export AWS_ACCESS_KEY_ID=$(echo "$creds" | cut -f1)"
                echo "export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | cut -f2)"
                echo "export AWS_SESSION_TOKEN=$(echo "$creds" | cut -f3)"
              } >> "$BASH_ENV"
            elif [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
              echo "authenticating with a static access key -- migrate this to OIDC"
            else
              echo "No AWS credentials. Set AWS_ROLE_ARN plus a context (OIDC, preferred)," >&2
              echo "or AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the project." >&2
              exit 1
            fi

      # Release versions are counted, not hashed: people read and type them. N is the next
      # after the highest already published FOR THIS REPO -- the counter is per repo, so two
      # repos sharing a number mean nothing.
      #
      # Two merges in the same minute compute the same N and the second push is refused,
      # because tags are immutable. That failure is loud and a re-run fixes it, which is the
      # trade we want against a silently duplicated version.
      #
      # Everything is computed in the shell FIRST and written to $BASH_ENV LAST, and the
      # count is allowed to fail loudly. Both matter. The previous version ran the ECR query
      # inside the `{ ... } >> "$BASH_ENV"` group, where ARTIFACT existed only as text being
      # written INTO that file -- never as a variable -- so the query expanded to an empty
      # repository name; --region was absent for the same reason, since AWS_REGION only
      # reaches the shell one step later. Both errors were then discarded by `2>/dev/null`
      # and `|| true`, leaving an empty count that resolves to ".1". The next step finds
      # ".1" already published and halts the job GREEN: nothing pushed, no notification,
      # no red build. It looked like a working pipeline for a whole release.
      - run:
          name: Work out the artifact name and version
          command: |
            set -euo pipefail
            case "$CIRCLE_BRANCH" in
                *_dev)     series="${CIRCLE_BRANCH%_dev}";     channel="dev" ;;
                *_staging) series="${CIRCLE_BRANCH%_staging}"; channel="staging" ;;
                # The series branch IS the release channel. A merge into it is the act of
                # releasing, so it publishes like any other branch rather than waiting for a
                # separate ceremony that can be forgotten.
                [0-9]*.[0-9]*) series="$CIRCLE_BRANCH";        channel="release" ;;
                *) echo "Branch '$CIRCLE_BRANCH' is not a series branch; nothing to publish."
                   circleci-agent step halt ;;
            esac
            sha12="$(git rev-parse --short=12 HEAD)"

            # Ask AWS who we are rather than hardcoding it. The job already holds
            # credentials, so the account is a fact it can look up -- not a constant to copy
            # into every repo and keep in sync.
            region="${AWS_REGION:-${AWS_DEFAULT_REGION:-<< pipeline.parameters.aws_region >>}}"
            account="$(aws sts get-caller-identity --query Account --output text)"

            artifact="$CIRCLE_PROJECT_REPONAME"

            if [ "$channel" = "release" ]; then
              esc="$(printf %s "$series" | sed 's/\./\\./g')"
              if ! tags="$(aws ecr describe-images --region "$region" \
                     --repository-name "<< pipeline.parameters.ecr_prefix >>/${artifact}" \
                     --query 'imageDetails[].imageTags[]' --output text 2>&1)"; then
                case "$tags" in
                  *RepositoryNotFoundException*) tags="" ;;
                  *) echo "cannot count published versions: $tags" >&2; exit 1 ;;
                esac
              fi
              latest="$(printf %s "$tags" | tr '\t' '\n' \
                        | grep -E "^${esc}\.[0-9]+$" | sed "s/^${esc}\.//" \
                        | sort -n | tail -1 || true)"
              version="${series}.$(( ${latest:-0} + 1 ))"
            else
              version="${series}-${channel}.${sha12}"
            fi

            {
              echo "export AWS_REGION=$region"
              echo "export REGISTRY=${account}.dkr.ecr.${region}.amazonaws.com"
              echo "export ARTIFACT=$artifact"
              echo "export SERIES=$series"
              echo "export CHANNEL=$channel"
              echo "export VERSION=$version"
              echo "export SOURCE_SHA=$(git rev-parse HEAD)"
              echo "export SOURCE_TREE=$(git rev-parse HEAD^{tree})"
            } >> "$BASH_ENV"
            echo "will publish: $CIRCLE_PROJECT_REPONAME (channel $channel)"

      - run:
          name: Install oras (pinned and checksum-verified)
          command: |
            set -euo pipefail
            v="<< pipeline.parameters.oras_version >>"
            curl -fsSLo oras.tar.gz \
              "https://github.com/oras-project/oras/releases/download/v${v}/oras_${v}_linux_amd64.tar.gz"
            echo "9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59  oras.tar.gz" | sha256sum -c -
            tar -xzf oras.tar.gz oras && sudo mv oras /usr/local/bin/ && rm oras.tar.gz
            oras version

      - run:
          name: Package the modules
          command: |
            set -euo pipefail
            # Modules must sit at the ROOT of the tarball. addons_path points at
            # <mount>/addons/<artifact>, so a module one level deeper is simply never found
            # -- and Odoo says nothing about it.
            tar -czf "/tmp/${ARTIFACT}-${VERSION}.tar.gz" \
              --exclude='./.git' --exclude='./.circleci' --exclude='./.gitignore' .

            # Discovery is automatic; activation is not (spec 4.5e). Recording the module
            # list here lets a report answer "what does this pin provide" without pulling
            # the artifact, and the answer is minted with it so it cannot drift.
            modules="$(find . -maxdepth 2 -name __manifest__.py -printf '%h\n' | sed 's|^\./||' | sort | paste -sd, -)"
            echo "export MODULES=$modules" >> "$BASH_ENV"
            echo "$modules" | tr ',' '\n' | sed 's/^/  /'
            echo "module count: $(echo "$modules" | tr ',' '\n' | wc -l)"

      - run:
          name: Refuse to overwrite an existing version
          command: |
            set -euo pipefail
            # The repository has immutable tags, so a re-push fails anyway -- failing here
            # says why. Re-running a build for an unchanged commit is a no-op, not an error:
            # the artifact for that SHA already exists and holds the same content.
            if aws ecr describe-images --region "$AWS_REGION" \
                 --repository-name "<< pipeline.parameters.ecr_prefix >>/${ARTIFACT}" \
                 --image-ids "imageTag=${VERSION}" >/dev/null 2>&1; then
              echo "${VERSION} already published for this commit -- nothing to do."
              circleci-agent step halt
            fi

      - run:
          name: Publish
          command: |
            set -euo pipefail
            aws ecr get-login-password --region "$AWS_REGION" \
              | oras login --username AWS --password-stdin "$REGISTRY"

            cd /tmp
            oras push "${REGISTRY}/<< pipeline.parameters.ecr_prefix >>/${ARTIFACT}:${VERSION}" \
              --artifact-type "application/vnd.trocdigital.odoo-addons.v1+json" \
              --annotation "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --annotation "org.opencontainers.image.source=${CIRCLE_REPOSITORY_URL}" \
              --annotation "io.trocdigital.odoo.series=${SERIES}" \
              --annotation "io.trocdigital.odoo.branch=${CIRCLE_BRANCH}" \
              --annotation "io.trocdigital.odoo.tree=${SOURCE_TREE}" \
              --annotation "io.trocdigital.odoo.modules=${MODULES}" \
              "${ARTIFACT}-${VERSION}.tar.gz:application/vnd.trocdigital.odoo-addons.layer.v1.tar+gzip"

            # Marks the publish as successful for the notification step, which runs with
            # `when: always` and otherwise cannot tell success from failure.
            echo "export PUBLISH_OK=1" >> "$BASH_ENV"

      # CircleCI caps a `run` command at 2048 characters, so the rationale lives out here
      # as YAML comments -- these do not count towards the limit, the command body does.
      #
      # Built with printf and curl rather than python: every value in the message is a repo
      # name, a version string, a branch name or a hex sha, so there is no arbitrary text to
      # break the JSON. That was only a risk while the commit subject was included.
      #
      # `when: always` so a failed publish is announced too. A publish that fails in silence
      # is worse than one that fails loudly: someone edits a pin, waits for a rollout that
      # cannot happen, and debugs the cluster instead of the build.
      #
      # A Slack outage never fails the build -- the artifact is already published, and that
      # is the part that matters.
      - run:
          name: Tell Slack a version exists
          when: always
          command: |
            set -u
            [ -z "${SLACK_WEBHOOK_URL:-}" ] && { echo "no SLACK_WEBHOOK_URL, skipping"; exit 0; }
            case "${CHANNEL:-}" in dev) L=DEV;; staging) L=STAGING;; release) L=PROD;; *) L="?";; esac
            S=$(printf %.12s "${SOURCE_SHA:-}")
            f() { printf '{"type":"mrkdwn","text":"*%s:*  %s"}' "$1" "$2"; }
            if [ "${PUBLISH_OK:-}" = 1 ]; then
              H="New Odoo addon version published"
              FL="$(f Addon "\`$ARTIFACT\`"),$(f Version "\`$VERSION\`"),$(f Channel "$L (\`$CIRCLE_BRANCH\`)"),$(f 'Odoo series' "${SERIES:-?}"),$(f Commit "\`$S\`")"
            else
              H="Odoo addon publish FAILED"
              FL="$(f Addon "\`${ARTIFACT:-$CIRCLE_PROJECT_REPONAME}\`"),$(f Branch "\`$CIRCLE_BRANCH\`"),$(f Commit "\`$S\`")"
            fi
            C="{\"type\":\"mrkdwn\",\"text\":\"<$CIRCLE_BUILD_URL|CircleCI build log>\"}"
            P="{\"blocks\":[{\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"$H\"}},{\"type\":\"section\",\"fields\":[$FL]},{\"type\":\"context\",\"elements\":[$C]}]}"
            curl -sS -m 20 -X POST -H 'Content-Type: application/json' -d "$P" "$SLACK_WEBHOOK_URL" || echo "slack failed (ignored)"

      - run:
          name: What to do with it
          command: |
            echo ""
            echo "============================================================"
            echo "  PUBLISHED"
            echo ""
            echo "    ${ARTIFACT}: \"${VERSION}\""
            echo ""
            echo "  Nothing is deployed yet, and nothing will be until someone"
            echo "  changes an instance's pin. To move an instance, edit its"
            echo "  addons.yaml in navigator-platform:"
            echo ""
            echo "    odoo-deployments/<env>/<instance>/addons.yaml"
            echo ""
            echo "      addons:"
            echo "        repos:"
            echo "          ${ARTIFACT}: \"${VERSION}\""
            echo ""
            echo "  Any instance whose file you do not touch stays exactly"
            echo "  where it is. That is the point."
            echo "============================================================"

workflows:
  publish-addon-artifact:
    jobs:
      - publish:
          # Carries AWS_ROLE_ARN and SLACK_WEBHOOK_URL -- but attaching it is REQUIRED for a
          # second, less obvious reason: CircleCI only injects CIRCLE_OIDC_TOKEN_V2 into jobs
          # that use at least one context. Without this line there is no OIDC token, and the
          # job falls back to looking for static keys that should not exist.
          context: odoo-projects
          filters:
            branches:
              only:
                - /^[0-9]+\.[0-9]+$/
                - /^[0-9]+\.[0-9]+_dev$/
                - /^[0-9]+\.[0-9]+_staging$/
